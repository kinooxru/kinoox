name: Build Desktop Apps

# Сборка нативных приложений Tauri 2 для Windows, macOS и Linux.
# Артефакты: .exe + .msi, .dmg + .app, .AppImage + .deb + .rpm.

on:
  push:
    tags:
      - 'desktop-v*'
    paths:
      - 'apps/desktop/**'
      - '.github/workflows/build-desktop.yml'
  workflow_dispatch:

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'
  RUST_VERSION: 'stable'

jobs:

  verify:
    name: Проверка типов
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Установка зависимостей
        run: pnpm install --frozen-lockfile=false

      - name: Проверка типов десктопного приложения
        run: pnpm --filter @kinoox/desktop typecheck

  build:
    name: ${{ matrix.name }}
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows (.exe, .msi)
            os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis,msi
            artifact: kinoox-windows
          - name: macOS (.dmg, .app)
            os: macos-14
            target: aarch64-apple-darwin
            bundles: dmg,app
            artifact: kinoox-macos-arm64
          - name: macOS Intel (.dmg, .app)
            os: macos-13
            target: x86_64-apple-darwin
            bundles: dmg,app
            artifact: kinoox-macos-x64
          - name: Linux (.AppImage, .deb, .rpm)
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: appimage,deb,rpm
            artifact: kinoox-linux

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target

      # Системные библиотеки для сборки Tauri на Linux
      - name: Установка зависимостей Linux
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev \
            libsoup-3.0-dev \
            build-essential \
            curl wget file \
            rpm

      - name: Установка зависимостей
        run: pnpm install --frozen-lockfile=false

      - name: Сборка фронтенда
        working-directory: apps/desktop
        run: pnpm exec vite build

      - name: Сборка нативных бандлов
        working-directory: apps/desktop
        run: pnpm exec tauri build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}
        env:
          # Подпись обновлений Tauri
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Подпись Windows-установщиков (опционально)
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          # Нотаризация macOS
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Загрузка артефактов
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/rpm/*.rpm
          retention-days: 30
          if-no-files-found: warn

  publish:
    name: Публикация сборок
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Копирование на сервер
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: 'artifacts/**'
          target: '/opt/kinoox/storage/downloads/'
