# ─────────────────────────────────────────────────────────────
#  KINOOX — дополнительная конфигурация PostgreSQL 16
#  Сервер: i7-6700 / 64 ГБ RAM / Debian 12
#  Основные параметры передаются через command в docker-compose.
# ─────────────────────────────────────────────────────────────

# ── Подключения ──────────────────────────────────────────────
max_connections = 100
superuser_reserved_connections = 3

# ── Память ───────────────────────────────────────────────────
shared_buffers = 16GB
effective_cache_size = 32GB
work_mem = 256MB
maintenance_work_mem = 2GB
wal_buffers = 64MB

# ── Планировщик ──────────────────────────────────────────────
random_page_cost = 1.1
effective_io_concurrency = 200
default_statistics_target = 500

# ── WAL и контрольные точки ──────────────────────────────────
wal_level = replica
max_wal_size = 4GB
min_wal_size = 1GB
checkpoint_completion_target = 0.9
archive_mode = on
archive_command = 'test ! -f /backups/wal_archive/%f && cp %p /backups/wal_archive/%f'

# ── Автоочистка ──────────────────────────────────────────────
autovacuum = on
autovacuum_max_workers = 3
autovacuum_naptime = 30s
autovacuum_vacuum_cost_limit = 1000
autovacuum_vacuum_cost_delay = 10ms

# ── Логирование ──────────────────────────────────────────────
log_min_duration_statement = 500
log_lock_waits = on
log_temp_files = 0
log_autovacuum_min_duration = 0
log_line_prefix = '%t [%p]: user=%u,db=%d,app=%a,client=%h '
log_connections = off
log_disconnections = off

# ── Производительность под нагрузкой ─────────────────────────
track_io_timing = on
track_activity_query_size = 2048
stats_temp_directory = '/var/lib/postgresql/data/pg_stat_tmp'

# ── Репликация (задел на будущее) ────────────────────────────
hot_standby = on

# ── Локаль и часовой пояс ────────────────────────────────────
timezone = 'Europe/Moscow'
lc_messages = 'C.UTF-8'
lc_monetary = 'C.UTF-8'
lc_numeric = 'C.UTF-8'
lc_time = 'C.UTF-8'
default_text_search_config = 'pg_catalog.russian'