# ─────────────────────────────────────────────────────────────
#  KINOOX.RU — Production Docker Compose
#  Сервер: Intel Core i7-6700 / 64 ГБ RAM / 2×512 ГБ SSD
#  ОС: Debian 12 (Bookworm) · IP: 95.216.97.185
#
#  20 сервисов: БД, кэш, API, сайт, Nginx, SSL, бэкапы, S3,
#  админка, мониторинг (Prometheus, Grafana, Alertmanager),
#  логирование (Loki, Promtail) и автообновление образов.
# ─────────────────────────────────────────────────────────────

x-restart-policy: &restart-policy
  restart: unless-stopped

x-security-hardening: &security-hardening
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL

x-logging: &default-logging
  logging:
    driver: json-file
    options:
      max-size: "50m"
      max-file: "5"

x-env: &default-env
  env_file:
    - ../.env
  environment:
    TZ: Europe/Moscow

services:

  # ───────────────────────────────────────────────────────────
  #  PostgreSQL 16 — основная база данных
  # ───────────────────────────────────────────────────────────
  postgres:
    <<: [*restart-policy, *default-logging, *security-hardening]
    image: postgres:16
    container_name: kinoox-postgres
    stop_grace_period: 60s
    shm_size: 2gb
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - DAC_OVERRIDE
    deploy:
      resources:
        limits:
          memory: 32G
        reservations:
          memory: 4G
    environment:
      POSTGRES_USER: ${DB_USER:-kinoox}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Задайте DB_PASSWORD в .env}
      POSTGRES_DB: ${DB_NAME:-kinoox_db}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C.UTF-8"
      TZ: Europe/Moscow
    command: >
      postgres
      -c max_connections=100
      -c shared_buffers=16GB
      -c effective_cache_size=32GB
      -c work_mem=256MB
      -c maintenance_work_mem=2GB
      -c wal_buffers=64MB
      -c checkpoint_completion_target=0.9
      -c random_page_cost=1.1
      -c effective_io_concurrency=200
      -c log_min_duration_statement=500
      -c log_connections=off
      -c log_disconnections=off
      -c log_line_prefix="%t [%p]: user=%u,db=%d,app=%a,client=%h "
      -c log_lock_waits=on
      -c log_temp_files=0
      -c log_autovacuum_min_duration=0
      -c stats_temp_directory=/var/lib/postgresql/data/pg_stat_tmp
      -c timezone=Europe/Moscow
      -c track_activity_query_size=2048
      -c track_io_timing=on
      -c autovacuum=on
      -c autovacuum_max_workers=3
      -c autovacuum_naptime=30s
      -c autovacuum_vacuum_cost_limit=1000
      -c autovacuum_vacuum_cost_delay=10ms
      -c default_statistics_target=500
      -c max_wal_size=4GB
      -c min_wal_size=1GB
      -c archive_mode=on
      -c archive_command="test ! -f /backups/wal_archive/%f && cp %p /backups/wal_archive/%f"
      -c hot_standby=on
      -c wal_level=replica
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
      nproc:
        soft: 4096
        hard: 4096
    volumes:
      - pg_data:/var/lib/postgresql/data
      - pg_stat_tmp:/var/lib/postgresql/data/pg_stat_tmp
      - ../docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - ../docker/postgres/postgresql.conf:/etc/postgresql/postgresql.conf:ro
      - ../storage/backups:/backups
      - ../storage/backups/wal_archive:/backups/wal_archive
      - pg_run:/var/run/postgresql
    tmpfs:
      - /tmp:size=512M
    networks:
      kinoox_backend:
        aliases:
          - postgres
          - db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-kinoox} -d ${DB_NAME:-kinoox_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    labels:
      - "com.centurylinklabs.watchtower.enable=false"
      - "kinoox.service=database"
      - "kinoox.tier=critical"

  # ───────────────────────────────────────────────────────────
  #  Redis 7 — кэш и сессии
  # ───────────────────────────────────────────────────────────
  redis:
    <<: [*restart-policy, *default-logging, *security-hardening]
    image: redis:7
    container_name: kinoox-redis
    stop_grace_period: 15s
    cap_add:
      - SETGID
      - SETUID
      - DAC_OVERRIDE
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 512M
    command: >
      redis-server
      --maxmemory 4gb
      --maxmemory-policy allkeys-lru
      --save 900 1
      --save 300 10
      --save 60 10000
      --appendonly yes
      --appendfsync everysec
      --no-appendfsync-on-rewrite no
      --auto-aof-rewrite-percentage 100
      --auto-aof-rewrite-min-size 64mb
      --timeout 300
      --tcp-keepalive 60
      --hz 10
      --loglevel notice
      --latency-monitor-threshold 100
      --slowlog-log-slower-than 10000
      --slowlog-max-len 128
      --client-output-buffer-limit normal 0 0 0
      --client-output-buffer-limit replica 256mb 64mb 60
      --client-output-buffer-limit pubsub 32mb 8mb 60
      --notify-keyspace-events Exg
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - redis_data:/data
    tmpfs:
      - /tmp:size=128M
    networks:
      kinoox_backend:
        aliases:
          - redis
          - cache
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    labels:
      - "com.centurylinklabs.watchtower.enable=false"
      - "kinoox.service=cache"
      - "kinoox.tier=critical"

  # ───────────────────────────────────────────────────────────
  #  Prisma Migrations — one-shot: применяет схему и seed
  # ───────────────────────────────────────────────────────────
  migrate:
    <<: *security-hardening
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    container_name: kinoox-migrate
    restart: "no"
    command: >
      sh -c "
        echo '=== KINOOX Migration Runner ==='
        attempt=1
        max_attempts=30
        while [ $$attempt -le $$max_attempts ]; do
          if npx prisma migrate deploy; then
            echo 'Migrations applied successfully'
            break
          fi
          echo 'Attempt '$$attempt'/'$$max_attempts': retry in 5 seconds'
          sleep 5
          attempt=$$((attempt + 1))
        done
        if [ $$attempt -gt $$max_attempts ]; then
          echo 'ERROR: failed to apply migrations'
          exit 1
        fi
        echo 'Running seed...'
        npx prisma db seed
        echo '=== Migration and seed completed ==='
      "
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - kinoox_backend
    env_file:
      - ../.env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${DB_USER:-kinoox}:${DB_PASSWORD}@postgres:5432/${DB_NAME:-kinoox_db}?schema=public
      TZ: Europe/Moscow
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "1"

  # ───────────────────────────────────────────────────────────
  #  API — Fastify + Node.js 20
  # ───────────────────────────────────────────────────────────
  api:
    <<: [*restart-policy, *default-logging, *security-hardening]
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    container_name: kinoox-api
    stop_grace_period: 30s
    cap_add:
      - NET_BIND_SERVICE
    deploy:
      resources:
        limits:
          memory: 8G
        reservations:
          memory: 2G
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      kinoox_backend:
        aliases:
          - api
          - backend
      kinoox_frontend:
        aliases:
          - api
    env_file:
      - ../.env
    environment:
      NODE_ENV: production
      TZ: Europe/Moscow
      DATABASE_URL: postgresql://${DB_USER:-kinoox}:${DB_PASSWORD}@postgres:5432/${DB_NAME:-kinoox_db}?schema=public
      REDIS_URL: redis://redis:6379
      API_PORT: 3001
      API_HOST: 0.0.0.0
      PLAYERS_MODE: ${PLAYERS_MODE:-real}
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    dns:
      - 8.8.8.8
      - 8.8.4.4
    tmpfs:
      - /tmp:size=256M
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:3001/api/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 40s
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
      - "kinoox.service=api"
      - "kinoox.tier=critical"

  # ───────────────────────────────────────────────────────────
  #  Web — Next.js 14+ SSR
  # ───────────────────────────────────────────────────────────
  web:
    <<: [*restart-policy, *default-logging, *security-hardening]
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: https://kinoox.ru/api/v1
        NEXT_PUBLIC_SOCKET_URL: https://kinoox.ru
        NEXT_PUBLIC_SITE_URL: https://kinoox.ru
    container_name: kinoox-web
    stop_grace_period: 30s
    cap_add:
      - NET_BIND_SERVICE
    deploy:
      resources:
        limits:
          memory: 8G
        reservations:
          memory: 2G
    depends_on:
      api:
        condition: service_healthy
    networks:
      kinoox_frontend:
        aliases:
          - web
          - frontend
    env_file:
      - ../.env
    environment:
      NODE_ENV: production
      TZ: Europe/Moscow
      NEXT_PUBLIC_API_URL: https://kinoox.ru/api/v1
      NEXT_PUBLIC_SOCKET_URL: https://kinoox.ru
      NEXT_PUBLIC_SITE_URL: https://kinoox.ru
      PORT: 3000
      HOSTNAME: 0.0.0.0
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    tmpfs:
      - /tmp:size=256M
      - /app/apps/web/.next/cache:size=512M
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:3000/ || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 40s
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
      - "kinoox.service=web"
      - "kinoox.tier=critical"

  # ───────────────────────────────────────────────────────────
  #  Nginx — reverse proxy, SSL, статика, rate limit
  # ───────────────────────────────────────────────────────────
  nginx:
    <<: [*restart-policy, *default-logging, *security-hardening]
    image: nginx:alpine
    container_name: kinoox-nginx
    stop_grace_period: 15s
    cap_add:
      - NET_BIND_SERVICE
      - CHOWN
      - SETUID
      - SETGID
      - DAC_OVERRIDE
    ports:
      - target: 80
        published: 80
        protocol: tcp
        mode: host
      - target: 443
        published: 443
        protocol: tcp
        mode: host
    volumes:
      - ../nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../nginx/conf.d:/etc/nginx/conf.d:ro
      - ../deploy/ssl:/etc/nginx/ssl:ro
      - ../deploy/ssl-www:/var/www/letsencrypt:rw
      - ../storage/downloads:/usr/share/nginx/downloads:ro
      - nginx_cache:/var/cache/nginx
      - nginx_logs:/var/log/nginx
      - nginx_run:/var/run
      - nginx_tmp:/tmp
    tmpfs:
      - /var/cache/nginx/client_temp:size=128M
      - /var/cache/nginx/proxy_temp:size=128M
      - /var/cache/nginx/fastcgi_temp:size=128M
      - /var/cache/nginx/uwsgi_temp:size=128M
      - /var/cache/nginx/scgi_temp:size=128M
    depends_on:
      web:
        condition: service_healthy
      api:
        condition: service_healthy
    networks:
      kinoox_frontend:
        aliases:
          - nginx
          - proxy
      kinoox_monitoring:
        aliases:
          - nginx
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost/health 2>/dev/null || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 10s
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
      - "kinoox.service=proxy"
      - "kinoox.tier=critical"

  # ───────────────────────────────────────────────────────────
  #  Certbot — первичный выпуск SSL-сертификата
  # ───────────────────────────────────────────────────────────
  certbot:
    <<: *security-hardening
    image: certbot/certbot
    container_name: kinoox-certbot
    restart: "no"
    volumes:
      - ../deploy/ssl:/etc/letsencrypt:rw
      - ../deploy/ssl-www:/var/www/letsencrypt:rw
    entrypoint: >
      sh -c "
        if [ -f /etc/letsencrypt/live/kinoox.ru/fullchain.pem ]; then
          echo 'Сертификат уже выпущен — пропускаем';
          exit 0;
        fi
        echo 'Запрашиваем сертификат для kinoox.ru...';
        certbot certonly
          --webroot
          --webroot-path=/var/www/letsencrypt
          --email ${SSL_EMAIL:-admin@kinoox.ru}
          --agree-tos
          --no-eff-email
          -d kinoox.ru
          -d www.kinoox.ru
          --non-interactive
        echo 'Сертификат получен.';
      "
    depends_on:
      nginx:
        condition: service_healthy
    networks:
      - kinoox_frontend
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "1"

  # ───────────────────────────────────────────────────────────
  #  Certbot Renewer — автообновление SSL каждый день в 3:00
  # ───────────────────────────────────────────────────────────
  certbot-renewer:
    <<: [*restart-policy, *default-logging, *security-hardening]
    image: certbot/certbot
    container_name: kinoox-certbot-renewer
    volumes:
      - ../deploy/ssl:/etc/letsencrypt:rw
      - ../deploy/ssl-www:/var/www/letsencrypt:rw
    entrypoint: >
      sh -c "
        echo '=== KINOOX SSL Renewer ===';
        echo '0 3 * * * certbot renew --webroot --webroot-path=/var/www/letsencrypt --non-interactive --quiet --deploy-hook \"touch /tmp/ssl_renewed\"' > /etc/crontabs/root;
        echo 'Cron установлен, запускаем crond...';
        crond -f -l 8
      "
    depends_on:
      - nginx
    networks:
      - kinoox_frontend
    labels:
      - "com.centurylinklabs.watchtower.enable=false"

  # ───────────────────────────────────────────────────────────
  #  PG Backup — ежедневный дамп БД в 2:00, хранение 30 дней
  # ───────────────────────────────────────────────────────────
  pg-backup:
    <<: [*restart-policy, *default-logging, *security-hardening]
    image: postgres:16
    container_name: kinoox-pg-backup
    cap_add:
      - DAC_OVERRIDE
    environment:
      PGUSER: ${DB_USER:-kinoox}
      PGPASSWORD: ${DB_PASSWORD}
      PGHOST: postgres
      PGDATABASE: ${DB_NAME:-kinoox_db}
      TZ: Europe/Moscow
      RETENTION_DAYS: "30"
    entrypoint: >
      sh -c "
        echo '=== KINOOX PostgreSQL Backup ===';
        mkdir -p /backups/wal_archive;
        echo '0 2 * * * pg_dump -Fc -f /backups/kinoox_$$(date +\%Y\%m\%d_\%H\%M).dump && find /backups -name \"*.dump\" -mtime +'$${RETENTION_DAYS:-30}' -delete' > /etc/crontabs/root;
        crond -f -l 8
      "
    volumes:
      - ../storage/backups:/backups
      - ../storage/backups/wal_archive:/backups/wal_archive
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - kinoox_backend
    labels:
      - "com.centurylinklabs.watchtower.enable=false"

  # ───────────────────────────────────────────────────────────
  #  MinIO — S3-совместимое хранилище файлов сборок
  # ───────────────────────────────────────────────────────────
  minio:
    <<: [*restart-policy, *default-logging, *security-hardening]
    image: minio/minio:latest
    container_name: kinoox-minio
    stop_grace_period: 15s
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 256M
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-kinooxadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Задайте MINIO_ROOT_PASSWORD в .env}
      MINIO_DOMAIN: minio.kinoox.ru
      TZ: Europe/Moscow
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio_data:/data
    networks:
      kinoox_frontend:
        aliases:
          - minio
      kinoox_backend:
        aliases:
          - minio
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
      - "kinoox.service=storage"
      - "kinoox.tier=important"

  # ───────────────────────────────────────────────────────────
  #  MinIO Init — создание buckets при первом запуске
  # ───────────────────────────────────────────────────────────
  minio-init:
    <<: *security-hardening
    image: minio/mc:latest
    container_name: kinoox-minio-init
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      sh -c "
        echo '=== MinIO Init ===';
        until mc alias set kinoox http://minio:9000 ${MINIO_ROOT_USER:-kinooxadmin} ${MINIO_ROOT_PASSWORD}; do
          echo 'Ждём MinIO...';
          sleep 2;
        done;
        mc mb kinoox/downloads --ignore-existing;
        mc mb kinoox/screenshots --ignore-existing;
        mc mb kinoox/backups --ignore-existing;
        mc anonymous set download kinoox/downloads;
        echo 'Buckets созданы.';
      "
    networks:
      - kinoox_backend
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "1"

  # ───────────────────────────────────────────────────────────
  #  Adminer — веб-интерфейс управления БД
  # ───────────────────────────────────────────────────────────
  adminer:
    <<: [*restart-policy, *default-logging, *security-hardening]
    image: adminer:latest
    container_name: kinoox-adminer
    deploy:
      resources:
        limits:
          memory: 256M
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - kinoox_backend
      - kinoox_frontend
    environment:
      ADMINER_DEFAULT_SERVER: postgres
      ADMINER_DEFAULT_DB: ${DB_NAME:-kinoox_db}
      ADMINER_DEFAULT_USERNAME: ${DB_USER:-kinoox}
      ADMINER_DESIGN: nette
      TZ: Europe/Moscow
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
      - "kinoox.service=adminer"
      - "kinoox.tier=utility"

  # ───────────────────────────────────────────────────────────
  #  Watchtower — автообновление образов по метке
  # ───────────────────────────────────────────────────────────
  watchtower:
    <<: [*restart-policy, *default-logging, *security-hardening]
    image: containrrr/watchtower
    container_name: kinoox-watchtower
    cap_add:
      - DAC_OVERRIDE
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      WATCHTOWER_CLEANUP: "true"
      WATCHTOWER_POLL_INTERVAL: 86400
      WATCHTOWER_LABEL_ENABLE: "true"
      WATCHTOWER_INCLUDE_RESTARTING: "true"
      WATCHTOWER_ROLLING_RESTART: "true"
      TZ: Europe/Moscow
    command: --label-enable --debug
    networks:
      - kinoox_monitoring
    labels:
      - "com.centurylinklabs.watchtower.enable=false"

  # ───────────────────────────────────────────────────────────
  #  МОНИТОРИНГ — Prometheus, Grafana, Alertmanager, экспортёры
  # ───────────────────────────────────────────────────────────

  prometheus:
    <<: [*restart-policy, *default-logging, *security-hardening]
    image: prom/prometheus:latest
    container_name: kinoox-prometheus
    cap_add:
      - DAC_OVERRIDE
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 256M
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--storage.tsdb.retention.size=10GB'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'
      - '--web.enable-admin-api'
    volumes:
      - ../docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../docker/prometheus/alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
      - prometheus_data:/prometheus
    networks:
      - kinoox_monitoring
      - kinoox_backend
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
      - "kinoox.service=monitoring"

  grafana:
    <<: [*restart-policy, *default-logging, *security-hardening]
    image: grafana/grafana:latest
    container_name: kinoox-grafana
    cap_add:
      - DAC_OVERRIDE
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 128M
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Задайте GRAFANA_ADMIN_PASSWORD в .env}
      GF_SERVER_ROOT_URL: https://kinoox.ru/grafana
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_USERS_ALLOW_ORG_CREATE: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SMTP_ENABLED: "false"
      GF_INSTALL_PLUGINS: ""
      TZ: Europe/Moscow
    volumes:
      - grafana_data:/var/lib/grafana
      - ../docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../docker/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      prometheus:
        condition: service_healthy
    networks:
      - kinoox_monitoring
      - kinoox_frontend
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
      - "kinoox.service=monitoring"

  node-exporter:
    <<: [*restart-policy, *default-logging, *security-hardening]
    image: prom/node-exporter:latest
    container_name: kinoox-node-exporter
    cap_add:
      - DAC_OVERRIDE
    command:
      - '--path.rootfs=/host'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
      - '--collector.cpu'
      - '--collector.diskstats'
      - '--collector.filesystem'
      - '--collector.loadavg'
      - '--collector.meminfo'
      - '--collector.netdev'
      - '--collector.netstat'
      - '--collector.stat'
      - '--collector.time'
      - '--collector.vmstat'
      - '--collector.processes'
    volumes:
      - /:/host:ro
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /etc:/host/etc:ro
    networks:
      - kinoox_monitoring
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
      - "kinoox.service=monitoring"

  cadvisor:
    <<: [*restart-policy, *default-logging, *security-hardening]
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: kinoox-cadvisor
    cap_add:
      - DAC_OVERRIDE
      - SYS_ADMIN
      - NET_ADMIN
    deploy:
      resources:
        limits:
          memory: 1G
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro
      - cadvisor_data:/tmp
    networks:
      - kinoox_monitoring
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
      - "kinoox.service=monitoring"

  alertmanager:
    <<: [*restart-policy, *default-logging, *security-hardening]
    image: prom/alertmanager:latest
    container_name: kinoox-alertmanager
    cap_add:
      - DAC_OVERRIDE
    deploy:
      resources:
        limits:
          memory: 256M
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
    volumes:
      - ../docker/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    networks:
      - kinoox_monitoring
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
      - "kinoox.service=monitoring"

  # ───────────────────────────────────────────────────────────
  #  ЛОГИРОВАНИЕ — Loki + Promtail
  # ───────────────────────────────────────────────────────────

  loki:
    <<: [*restart-policy, *default-logging, *security-hardening]
    image: grafana/loki:latest
    container_name: kinoox-loki
    cap_add:
      - DAC_OVERRIDE
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 256M
    command:
      - '-config.file=/etc/loki/loki-config.yml'
    volumes:
      - ../docker/loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki_data:/loki
    networks:
      - kinoox_monitoring
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3100/ready || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
      - "kinoox.service=logging"

  promtail:
    <<: [*restart-policy, *default-logging, *security-hardening]
    image: grafana/promtail:latest
    container_name: kinoox-promtail
    cap_add:
      - DAC_OVERRIDE
    deploy:
      resources:
        limits:
          memory: 512M
    command:
      - '-config.file=/etc/promtail/promtail-config.yml'
    volumes:
      - ../docker/promtail/promtail-config.yml:/etc/promtail/promtail-config.yml:ro
      - /var/log:/var/log:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - promtail_data:/tmp
    networks:
      - kinoox_monitoring
    depends_on:
      - loki
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
      - "kinoox.service=logging"

# ─────────────────────────────────────────────────────────────
#  ТОМА
# ─────────────────────────────────────────────────────────────
volumes:
  pg_data:
    driver: local
  pg_stat_tmp:
    driver: local
  pg_run:
    driver: local
  redis_data:
    driver: local
  nginx_cache:
    driver: local
  nginx_logs:
    driver: local
  nginx_run:
    driver: local
  nginx_tmp:
    driver: local
  minio_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
  alertmanager_data:
    driver: local
  loki_data:
    driver: local
  promtail_data:
    driver: local
  cadvisor_data:
    driver: local

# ─────────────────────────────────────────────────────────────
#  СЕТИ — сегментация по уровням доступа
# ─────────────────────────────────────────────────────────────
networks:
  # Frontend — Nginx, Web, API, MinIO (доступ к публичным портам)
  kinoox_frontend:
    driver: bridge
    name: kinoox_frontend
    ipam:
      driver: default
      config:
        - subnet: 172.20.1.0/24
          gateway: 172.20.1.1
    options:
      com.docker.network.bridge.name: br-kinoox-fe
      com.docker.network.bridge.enable_icc: "true"
      com.docker.network.bridge.enable_ip_masquerade: "true"
      com.docker.network.driver.mtu: 1500

  # Backend — PostgreSQL, Redis, API, MinIO (изолировано от интернета)
  kinoox_backend:
    driver: bridge
    name: kinoox_backend
    internal: true
    ipam:
      driver: default
      config:
        - subnet: 172.20.2.0/24
          gateway: 172.20.2.1
    options:
      com.docker.network.bridge.name: br-kinoox-be
      com.docker.network.bridge.enable_icc: "true"
      com.docker.network.driver.mtu: 1500

  # Monitoring — Prometheus, Grafana, экспортёры, Loki (изолировано)
  kinoox_monitoring:
    driver: bridge
    name: kinoox_monitoring
    internal: true
    ipam:
      driver: default
      config:
        - subnet: 172.20.3.0/24
          gateway: 172.20.3.1
    options:
      com.docker.network.bridge.name: br-kinoox-mon
      com.docker.network.bridge.enable_icc: "true"
      com.docker.network.driver.mtu: 1500
