# ─────────────────────────────────────────────────────────────
#  KINOOX — конфигурация Prometheus
#  Retention 30 дней / 10 ГБ, цели: API, экспортёры, Nginx.
# ─────────────────────────────────────────────────────────────

global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 15s
  external_labels:
    monitor: kinoox-production

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

rule_files:
  - /etc/prometheus/alert_rules.yml

scrape_configs:

  # Сам Prometheus
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  # Метрики хоста: CPU, RAM, диск, сеть
  - job_name: node-exporter
    static_configs:
      - targets: ['node-exporter:9100']

  # Метрики контейнеров: CPU, RAM, I/O
  - job_name: cadvisor
    static_configs:
      - targets: ['cadvisor:8080']

  # Healthcheck API через /api/health — проверка живости сервиса
  - job_name: kinoox-api
    metrics_path: /api/health
    scrape_interval: 30s
    static_configs:
      - targets: ['api:3001']
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: kinoox-api

  # Nginx-статистика через stub_status (если модуль включён)
  - job_name: nginx
    static_configs:
      - targets: ['nginx:80']
    metrics_path: /nginx_status
    scrape_interval: 30s
    honor_labels: true

  # PostgreSQL через postgres_exporter добавляется отдельно при необходимости
  # - job_name: postgres
  #   static_configs:
  #     - targets: ['postgres-exporter:9187']
