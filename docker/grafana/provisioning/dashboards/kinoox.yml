# ─────────────────────────────────────────────────────────────
#  KINOOX — Grafana: провайдеры дашбордов
# ─────────────────────────────────────────────────────────────

apiVersion: 1

providers:
  - name: KINOOX
    orgId: 1
    folder: KINOOX
    type: file
    disableDeletion: false
    updateIntervalSeconds: 60
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
