# ─────────────────────────────────────────────────────────────
#  KINOOX — главная конфигурация Nginx
#  Reverse proxy, gzip, кэш, rate limiting, логи в Docker-формате.
# ─────────────────────────────────────────────────────────────

user  nginx;
worker_processes  auto;
worker_rlimit_nofile 65536;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  8192;
    multi_accept        on;
    use                 epoll;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ── Логи ─────────────────────────────────────────────────
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time uct=$upstream_connect_time urt=$upstream_response_time';

    access_log /var/log/nginx/access.log main buffer=32k flush=5s;

    # ── Базовые настройки ────────────────────────────────────
    sendfile           on;
    tcp_nopush         on;
    tcp_nodelay        on;
    keepalive_timeout  65;
    keepalive_requests 1000;
    server_tokens      off;
    types_hash_max_size 4096;

    client_max_body_size 16m;
    client_body_buffer_size 128k;
    large_client_header_buffers 4 16k;

    # ── Сжатие ───────────────────────────────────────────────
    gzip              on;
    gzip_vary         on;
    gzip_comp_level   6;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_disable      "msie6";
    gzip_types
        text/plain text/css text/xml text/javascript
        application/json application/javascript application/xml
        application/rss+xml application/atom+xml application/x-font-ttf
        font/opentype image/svg+xml image/x-icon;

    # Brotli включается, если модуль доступен в образе
    # brotli on;
    # brotli_comp_level 6;
    # brotli_types text/plain text/css application/json application/javascript image/svg+xml;

    # ── Кэш API и статики ────────────────────────────────────
    proxy_cache_path /var/cache/nginx/api levels=1:2 keys_zone=api_cache:32m
                     max_size=2g inactive=10m use_temp_path=off;
    proxy_cache_path /var/cache/nginx/static levels=1:2 keys_zone=static_cache:16m
                     max_size=1g inactive=24h use_temp_path=off;

    # ── Rate limiting ────────────────────────────────────────
    limit_req_zone  $binary_remote_addr zone=api_limit:16m rate=30r/s;
    limit_req_zone  $binary_remote_addr zone=auth_limit:8m  rate=3r/s;
    limit_req_zone  $binary_remote_addr zone=dl_limit:8m    rate=10r/s;
    limit_conn_zone $binary_remote_addr zone=conn_limit:16m;
    limit_req_status 429;
    limit_conn_status 429;

    # ── Upstream-ы ───────────────────────────────────────────
    resolver 127.0.0.11 valid=10s ipv6=off;

    upstream kinoox_web {
        server web:3000 resolve;
        keepalive 32;
    }

    upstream kinoox_api {
        server api:3001 resolve;
        keepalive 64;
    }

    # Карта для корректного Connection при keepalive
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Отдаём заголовки CORS только для API
    map $request_uri $cors_header {
        default                  "";
        ~^/api/                  "*";
    }

    include /etc/nginx/conf.d/*.conf;
}
