# ─────────────────────────────────────────────────────────────
#  KINOOX.RU — виртуальный хост
#  HTTP → редирект на HTTPS, HTTPS → сайт и API.
#  www.kinoox.ru → kinoox.ru (301).
# ─────────────────────────────────────────────────────────────

# ── HTTP: ACME-челлендж и редирект на HTTPS ──────────────────
server {
    listen 80;
    listen [::]:80;
    server_name kinoox.ru www.kinoox.ru;

    # Внутренняя проверка состояния для healthcheck контейнера
    location = /health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # Webroot для Let's Encrypt
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type "text/plain";
        allow all;
    }

    # Всё остальное — на HTTPS
    location / {
        return 301 https://kinoox.ru$request_uri;
    }
}

# ── HTTP для healthcheck, когда SSL ещё не выпущен ───────────
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    location = /health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    location / {
        return 444;
    }
}

# ── HTTPS: основной хост ─────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name kinoox.ru;

    # ── SSL ──────────────────────────────────────────────────
    ssl_certificate     /etc/nginx/ssl/live/kinoox.ru/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/live/kinoox.ru/privkey.pem;
    ssl_trusted_certificate /etc/nginx/ssl/live/kinoox.ru/chain.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_session_cache shared:SSL:16m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;

    # ── Безопасность ─────────────────────────────────────────
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    limit_conn conn_limit 64;

    # ── Здоровье ─────────────────────────────────────────────
    location = /health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # ── API: проксируем в Fastify с коротким кэшем ───────────
    location /api/ {
        limit_req zone=api_limit burst=60 nodelay;
        limit_req zone=auth_limit burst=10 nodelay;

        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $request_id;

        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;

        # Кэшируем только публичные GET-запросы на 60 секунд
        proxy_cache api_cache;
        proxy_cache_methods GET HEAD;
        proxy_cache_key "$scheme$request_method$host$request_uri";
        proxy_cache_valid 200 60s;
        proxy_cache_valid 404 10s;
        proxy_cache_bypass $http_authorization $cookie_session;
        proxy_no_cache $http_authorization $cookie_session;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_background_update on;
        proxy_cache_lock on;

        add_header X-Cache-Status $upstream_cache_status always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # ── Socket.io: WebSocket с апгрейдом ────────────────────
    location /socket.io/ {
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ── Файлы сборок приложений (APK, .exe, .dmg, .AppImage) ─
    location /downloads/ {
        limit_req zone=dl_limit burst=20 nodelay;
        alias /usr/share/nginx/downloads/;

        # Правильные Content-Type для установщиков
        types {
            application/vnd.android.package-archive apk;
            application/octet-stream                 exe msi dmg AppImage;
            application/x-debian-package             deb;
            application/x-rpm                        rpm;
            application/octet-stream                 ipa;
        }

        add_header Content-Disposition "attachment" always;
        add_header Cache-Control "public, max-age=604800" always;
        add_header X-Content-Type-Options "nosniff" always;

        # Большие файлы отдаём без буферизации
        sendfile on;
        tcp_nopush on;
        aio threads;
        directio 8m;
        output_buffers 2 1m;
    }

    # ── Сборки десктопа для автообновления Tauri ────────────
    location /updates/ {
        alias /usr/share/nginx/downloads/updates/;
        add_header Cache-Control "no-cache" always;
    }

    # ── Мониторинг: Grafana, Prometheus, Alertmanager ───────
    location /grafana/ {
        proxy_pass http://grafana:3000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Доступ только с localhost и из внутренней сети
        allow 127.0.0.1;
        allow 172.20.0.0/16;
        deny all;
    }

    location /prometheus/ {
        proxy_pass http://prometheus:9090/;
        proxy_set_header Host $host;
        allow 127.0.0.1;
        allow 172.20.0.0/16;
        deny all;
    }

    location /alertmanager/ {
        proxy_pass http://alertmanager:9093/;
        proxy_set_header Host $host;
        allow 127.0.0.1;
        allow 172.20.0.0/16;
        deny all;
    }

    location /adminer/ {
        proxy_pass http://adminer:8080/;
        proxy_set_header Host $host;
        allow 127.0.0.1;
        allow 172.20.0.0/16;
        deny all;
    }

    # ── Статика Next.js: кэш на 30 дней ─────────────────────
    location /_next/static/ {
        proxy_pass $web_upstream;
        proxy_cache static_cache;
        proxy_cache_valid 200 30d;
        proxy_cache_key "$scheme$request_method$host$request_uri";
        proxy_ignore_headers Cache-Control Expires Set-Cookie;
        add_header Cache-Control "public, max-age=2592000, immutable" always;
        add_header X-Cache-Status $upstream_cache_status always;
        access_log off;
    }

    location /brand/ {
        proxy_pass $web_upstream;
        proxy_cache static_cache;
        proxy_cache_valid 200 30d;
        add_header Cache-Control "public, max-age=2592000, immutable" always;
        access_log off;
    }

    location /screenshots/ {
        proxy_pass $web_upstream;
        proxy_cache static_cache;
        proxy_cache_valid 200 30d;
        add_header Cache-Control "public, max-age=2592000" always;
        access_log off;
    }

    # ── Сайт: SSR через Next.js ─────────────────────────────
    location / {
        proxy_pass $web_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $request_id;

        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # Nginx-кэш SSR-страниц на 5 минут — дополняет ISR Next.js
        proxy_cache api_cache;
        proxy_cache_key "$scheme$request_method$host$request_uri";
        proxy_cache_valid 200 5m;
        proxy_cache_bypass $cookie_session $http_authorization;
        proxy_no_cache $cookie_session $http_authorization;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_background_update on;

        add_header X-Cache-Status $upstream_cache_status always;
    }

    # Закрываем доступ к служебным файлам
    location ~ /\.(?!well-known) {
        deny all;
    }
}

# ── HTTPS: www → без www, 301 ────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.kinoox.ru;

    ssl_certificate     /etc/nginx/ssl/live/kinoox.ru/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/live/kinoox.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:16m;
    ssl_session_timeout 1d;

    return 301 https://kinoox.ru$request_uri;
}
