<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 750" width="500" height="750" role="img" aria-label="Леон">
  <defs>
    <linearGradient id="bg6" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="hsl(30, 68%, 22%)" />
      <stop offset="55%" stop-color="#0C0E14" />
      <stop offset="100%" stop-color="#06070A" />
    </linearGradient>
    <linearGradient id="accent6" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FF3D6E" />
      <stop offset="100%" stop-color="#FF6B3D" />
    </linearGradient>
    <radialGradient id="glow6" cx="24%" cy="16%" r="58%">
      <stop offset="0%" stop-color="hsl(30, 82%, 58%)" stop-opacity="0.42" />
      <stop offset="100%" stop-color="hsl(30, 82%, 58%)" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="500" height="750" fill="url(#bg6)" />
  <rect width="500" height="750" fill="url(#glow6)" />

  <!-- Диагональные штрихи: кинематографичная текстура -->
  <g opacity="0.07" stroke="#F5F7FA" stroke-width="1">
    <line x1="-200" y1="750" x2="60" y2="0" /><line x1="-144" y1="750" x2="116" y2="0" /><line x1="-88" y1="750" x2="172" y2="0" /><line x1="-32" y1="750" x2="228" y2="0" /><line x1="24" y1="750" x2="284" y2="0" /><line x1="80" y1="750" x2="340" y2="0" /><line x1="136" y1="750" x2="396" y2="0" /><line x1="192" y1="750" x2="452" y2="0" /><line x1="248" y1="750" x2="508" y2="0" /><line x1="304" y1="750" x2="564" y2="0" /><line x1="360" y1="750" x2="620" y2="0" /><line x1="416" y1="750" x2="676" y2="0" /><line x1="472" y1="750" x2="732" y2="0" /><line x1="528" y1="750" x2="788" y2="0" /><line x1="584" y1="750" x2="844" y2="0" /><line x1="640" y1="750" x2="900" y2="0" />
  </g>

  <!-- Монограмма бренда -->
  <text x="44" y="300" font-family="Space Grotesk, Inter, sans-serif" font-size="230"
        font-weight="700" fill="#F5F7FA" opacity="0.09">Л</text>

  <!-- Верхняя строка: тип и год -->
  <text x="44" y="70" font-family="JetBrains Mono, monospace" font-size="19"
        letter-spacing="4" fill="rgba(245,247,250,0.55)">KINOOX</text>

  <!-- Рейтинг в круглом бейдже по центру справа -->
  <g transform="translate(410, 300)">
    <circle r="40" fill="url(#accent6)" />
    <text y="8" text-anchor="middle" font-family="JetBrains Mono, monospace"
          font-size="24" font-weight="600"
          fill="#06070A">8.7</text>
  </g>

  <!-- Название -->
  <text x="44" y="560" font-family="Space Grotesk, Inter, sans-serif" font-size="40"
        font-weight="700" fill="#F5F7FA" letter-spacing="-1"><tspan x="44" dy="0">Леон</tspan></text>

  <!-- Тип и год -->
  <text x="44" y="700" font-family="JetBrains Mono, monospace" font-size="20"
        letter-spacing="3" fill="rgba(139,146,168,0.9)">ФИЛЬМ · 1994</text>

  <!-- Акцентная полоса снизу -->
  <rect x="0" y="742" width="500" height="8" fill="url(#accent6)" />
</svg>
